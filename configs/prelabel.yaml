# Bước 2 — gán nhãn sơ bộ. Mọi tham số ở đây, không hard-code trong script.

model: models/yolo26n.pt # đường dẫn tương đối gốc repo; cũng nhận tên file (vd yolo26s.pt) để Ultralytics tự tải về cache
conf: 0.25               # ngưỡng tin cậy tối thiểu
iou: 0.7                 # ngưỡng NMS
imgsz: 960               # ảnh DETRAC là 960x540
device: cpu              # máy không có GPU NVIDIA
max_det: 100

# Ánh xạ lớp COCO (id trong model pretrained) -> lớp DETRAC.
# COCO không có 'van' nên 'truck' được quy về 'van' (xe tải nhỏ/van là lớp gần nhất).
# Ánh xạ này là gần đúng, chính là một lý do bắt buộc phải có người sửa ở Bước 3.
class_map:
  2: car          # COCO car
  5: bus          # COCO bus
  3: motorcycle   # lớp motorcycle của model
  7: truck        # lớp truck của model
  1: others       # lớp bicycle của model
  0: person       # lớp person của model
export:
  min_conf: 0.25         # bỏ box có conf thấp hơn ngưỡng này
  drop_in_ignore: true   # bỏ box nằm trong vùng bỏ qua (configs/ignore_regions.json)
