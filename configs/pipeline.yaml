# Cấu hình pipeline dữ liệu — KHÔNG hard-code tham số trong script.

paths:
  inbox: data/inbox        # nơi thả dữ liệu mới (video hoặc thư mục ảnh)
  work_dir: data/prototype # thư mục làm việc của lô hiện tại

# Nguồn dữ liệu. Mỗi mục là MỘT camera.
#   kind: video   -> path trỏ tới file video, frame được tách bằng OpenCV
#   kind: images  -> path trỏ tới thư mục ảnh đã tách sẵn
# sequence_id mặc định lấy theo tên file/thư mục, ghi đè được bằng khoá `sequence`.
# `scene` là metadata tự khai, tuỳ chọn — đi thẳng vào metadata.jsonl của bản phát hành.
sources:
  - camera_id: cam01
    kind: video
    path: data/inbox/IMG_8491.MOV
sampling:
  source_fps: 25          # fps giả định cho nguồn `images`; nguồn `video` đọc fps thật từ file
  sample_every_n: 25      # lấy 1 frame mỗi N frame
  max_per_camera: 100     # giới hạn mỗi camera (0 = không giới hạn)
  image_glob: "*.jpg"     # mẫu tên file cho nguồn `images`

# Vùng ảnh không gán nhãn. Dữ liệu nằm ở file riêng vì sẽ do công cụ web sinh ra.
ignore_regions:
  file: configs/ignore_regions.json
  overlap_threshold: 0.5  # phần diện tích box nằm trong vùng bỏ qua thì coi là thuộc vùng đó

storage:
  bucket_raw_frames: raw-frames
  endpoint: localhost:9000
  secure: false

labeling:
  # Phiên bản guideline đang áp dụng (docs/labeling_guideline.md). Ghi vào từng ảnh khi phát hành.
  guideline_version: "1.0"

dataset:
  name: vehicle-detection   # tên bản phát hành, dùng trong MANIFEST.json và data.yaml
  source_note: "UA-DETRAC (Kaggle bratjay/ua-detrac-orig) + dữ liệu camera nội bộ"

# --- các bước do scripts/run_pipeline.py điều phối ---------------------------

cvat:
  project_name: "Vehicle detection"
  segment_size: 50        # số ảnh mỗi job
  camera: null            # null = mọi camera; đặt vd "cam03" để chỉ tạo task cho một camera

review:
  poll_seconds: 30        # nhịp hỏi lại CVAT xem job đã PASS chưa
  timeout_minutes: 0      # 0 = chờ vô hạn (bước này là người làm, không nên tự bỏ cuộc)

dvc:
  remote_name: minio
  remote_url: s3://dvc-store/vision-ai   # bucket tự tạo nếu chưa có
  endpoint_url: http://localhost:9000    # khớp với storage.endpoint ở trên
