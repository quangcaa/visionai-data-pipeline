# Cấu hình đo chất lượng nhãn sơ bộ (Bước 2): scripts/04_eval_prelabel.py, scripts/05_prelabels_to_cvat.py

iou_match: 0.5            # ngưỡng IoU coi là ghép đúng (dùng cho precision/recall/F1)
conf_report: 0.25         # ngưỡng conf khi báo cáo P/R/F1 (mAP quét toàn dải)
map_iou_range: [0.5, 0.95, 0.05]   # start, stop, step -> mAP50-95 kiểu COCO

# Vùng DETRAC cố ý không gán nhãn. Bỏ dự đoán nằm trong vùng này,
# nếu không model sẽ bị chấm "phát hiện thừa" oan.
ignore_regions:
  enabled: true
  overlap_threshold: 0.5  # phần diện tích box dự đoán nằm trong vùng bỏ qua
